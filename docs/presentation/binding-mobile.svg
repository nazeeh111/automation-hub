<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1000" viewBox="0 0 420 1000" role="img" aria-labelledby="t d"><title id="t">Same PDF. New posting. Fresh review.</title><desc id="d">One synthetic finished PDF is retained byte-for-byte in two prepared packages. Its old posting binding is refused with HTTP 409 after the employer text and deadline change. A new package bound to the new posting is explicitly reviewed. Campaign stays off, with zero model calls and zero submissions. This is an executed synthetic workflow, not a real employer application.</desc><style>text{font-family:Arial,"DejaVu Sans",sans-serif}</style><rect width="100%" height="100%" fill="#f5f8fa"/><text x="28" y="34" font-size="13" fill="#52656f" font-weight="400">Automation Hub / retained review context</text><text x="28" y="83" font-size="36" fill="#172d37" font-weight="600">Same PDF.</text><text x="28" y="127" font-size="36" fill="#172d37" font-weight="600">Fresh review.</text><text x="28" y="164" font-size="15" fill="#172d37" font-weight="400">A file hash does not establish current approval.</text><rect x="28" y="207" width="364" height="184" rx="4" fill="#fff" stroke="#bacbd2"/><text x="44" y="237" font-size="16" fill="#00758a" font-weight="600">01 / Reviewed for source A</text><text x="44" y="273" font-size="15" fill="#172d37" font-weight="400">Python preferred.</text><text x="44" y="301" font-size="15" fill="#172d37" font-weight="400">Deadline: 1 April 2027</text><text x="44" y="335" font-size="15" fill="#00758a" font-weight="600">Old package remains retained.</text><text x="44" y="367" font-size="13" fill="#52656f" font-weight="400">Retained content 640cd14a64</text><rect x="28" y="417" width="364" height="184" rx="4" fill="#fff" stroke="#bacbd2"/><text x="44" y="447" font-size="16" fill="#9a650c" font-weight="600">02 / A newer posting arrives</text><text x="44" y="483" font-size="15" fill="#172d37" font-weight="400">Python + signal processing.</text><text x="44" y="511" font-size="15" fill="#172d37" font-weight="400">Deadline: 1 March 2027</text><text x="44" y="545" font-size="15" fill="#9a650c" font-weight="600">Old review request: HTTP 409</text><text x="44" y="577" font-size="13" fill="#52656f" font-weight="400">Retained content 5ec853f236</text><rect x="28" y="627" width="364" height="184" rx="4" fill="#fff" stroke="#bacbd2"/><text x="44" y="657" font-size="16" fill="#00758a" font-weight="600">03 / Prepare and review again</text><text x="44" y="693" font-size="15" fill="#172d37" font-weight="400">Same finished PDF; new binding.</text><text x="44" y="721" font-size="15" fill="#172d37" font-weight="400">Current source: B</text><text x="44" y="755" font-size="15" fill="#00758a" font-weight="600">New package explicitly approved.</text><text x="44" y="787" font-size="13" fill="#52656f" font-weight="400">Retained content 5ec853f236</text><rect x="28" y="840" width="364" height="70" rx="4" fill="#e5eff2" stroke="#91acb8"/><text x="44" y="866" font-size="14" fill="#172d37" font-weight="600">Original + both packages: identical PDF bytes</text><text x="44" y="892" font-size="14" fill="#52656f" font-weight="400">SHA-256 011d4632df72b6e93b0e…</text><text x="28" y="946" font-size="14" fill="#00758a" font-weight="600">Campaign off · 0 model calls · 0 submissions</text><text x="28" y="982" font-size="11" fill="#52656f" font-weight="400">Fictional local employer adapter. No live application outcome.</text></svg>
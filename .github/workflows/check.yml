name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [service, browser]
    runs-on: macos-15-intel
    # Lanes own separate runners; a fixture failure does not cancel the other lane.
    # Keep cold service fixtures serial and preserve application/test deadlines.
    timeout-minutes: 40
    env:
      HUB_SOFFICE_BIN: /Applications/LibreOffice.app/Contents/MacOS/soffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure isolated fixture paths
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/automation-hub-browsers" >> "$GITHUB_ENV"
          echo "HUB_DATA_DIR=$RUNNER_TEMP/automation-hub-data" >> "$GITHUB_ENV"
      - name: Install locked packages
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npm run browser:install
      - name: Install document renderer
        run: |
          brew update
          brew install --cask libreoffice
      - name: Verify document renderer
        run: node scripts/check-renderer.mjs
      # Avoid overlapping cold LibreOffice/browser service fixtures on one runner.
      - name: Check synthetic service workflows
        if: matrix.lane == 'service'
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Check production build and browser workflows
        if: matrix.lane == 'browser'
        run: npm run build && npm run test:e2e

      - name: Report browser failure context
        if: failure() && matrix.lane == 'browser'
        run: |
          node --input-type=module <<'NODE'
          import {readdir,readFile,appendFile} from 'node:fs/promises';
          import path from 'node:path';
          const files=[];
          async function walk(directory){
            let entries;try{entries=await readdir(directory,{withFileTypes:true});}catch(error){if(error.code==='ENOENT')return;throw error;}
            for(const entry of entries){const file=path.join(directory,entry.name);if(entry.isDirectory())await walk(file);else if(entry.isFile()&&entry.name==='error-context.md')files.push(file);}
          }
          await walk('test-results');files.sort();
          const escape=value=>value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
          const lines=['## Browser failure context',`Found ${files.length} context files; showing at most 10, each limited to 16000 characters. Screenshots and traces remain local Playwright outputs.`];
          for(const file of files.slice(0,10)){
            const content=await readFile(file,'utf8');
            lines.push(`<details><summary>${escape(file)}</summary><pre>${escape(content.slice(0,16000))}${content.length>16000?'\n[Truncated]':''}</pre></details>`);
          }
          if(!files.length)lines.push("No browser context was produced. Check the failed step's log above.");
          await appendFile(process.env.GITHUB_STEP_SUMMARY,lines.join('\n\n')+'\n');
          NODE

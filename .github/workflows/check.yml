name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15-intel
    # Observed setup + serial service + browser stages can exceed 30min on Intel.
    # Keep fixture deadlines unchanged; bound the complete verification job.
    timeout-minutes: 40
    env:
      HUB_SOFFICE_BIN: /Applications/LibreOffice.app/Contents/MacOS/soffice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure isolated fixture paths
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/automation-hub-browsers" >> "$GITHUB_ENV"
          echo "HUB_DATA_DIR=$RUNNER_TEMP/automation-hub-data" >> "$GITHUB_ENV"
      - name: Install locked packages
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npm run browser:install
      - name: Install document renderer
        run: |
          brew update
          brew install --cask libreoffice
      - name: Verify document renderer
        run: node scripts/check-renderer.mjs
      # Avoid parallel cold LibreOffice and browser fixtures on this Intel runner.
      # Keep the complete service suite serial without extending renderer deadlines.
      - name: Check synthetic service workflows
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Check production build and browser workflows
        run: npm run build && npm run test:e2e
